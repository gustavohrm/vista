name: Feature
description: Something Vista should do that it does not do today.
labels: ["type:feature", "status:needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behavior you have in mind, if any.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What you tried or considered instead.
  - type: textarea
    id: contracts
    attributes:
      label: Contracts touched
      description: Which persisted formats, settings, defaults, limits, host adapter capabilities, or Tauri commands the proposal adds or changes, if any, and why each is needed.
