packages:
  - "apps/*"
  - "packages/*"

# Every version is declared once, here, and packages refer to it as `catalog:`, so the workspace can never
# hold two versions of one dependency by accident. A new third-party dependency adds its version here.
catalog:
  "@codemirror/commands": 6.11.1
  "@codemirror/language": 6.13.1
  "@codemirror/lint": 6.9.7
  "@codemirror/search": 6.7.2
  "@codemirror/state": 6.7.6
  "@codemirror/view": 6.43.15
  "@codenhub/icons": 0.3.0
  "@codenhub/styles": 0.7.0
  "@codenhub/theme": 0.2.2
  "@codenhub/toaster": 0.4.0
  "@lezer/common": 1.5.5
  "@lezer/highlight": 1.2.5
  "@milkdown/core": 7.23.0
  "@milkdown/plugin-history": 7.23.0
  "@milkdown/plugin-listener": 7.23.0
  "@milkdown/preset-commonmark": 7.23.0
  "@milkdown/preset-gfm": 7.23.0
  "@playwright/test": 1.65.0
  "@replit/codemirror-minimap": 0.5.2
  "@replit/codemirror-vim": 6.4.0
  "@tailwindcss/vite": 4.3.5
  "@tauri-apps/cli": 2.12.4
  "@tauri-apps/plugin-dialog": 2.8.4
  "@tauri-apps/plugin-fs": 2.7.1
  "@testing-library/dom": 10.4.2
  "@testing-library/jest-dom": 7.0.1
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.9
  "@types/papaparse": 5.5.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.3.0
  "@vitest/coverage-v8": 5.1.0
  jsdom: 29.1.1
  oxfmt: ^0.78.0
  oxlint: ^1.93.0
  papaparse: 5.7.0
  prettier: ^3.9.9
  react-dom: 19.3.1
  react: 19.3.1
  tailwindcss: 4.3.5
  typescript: ^6.0.3
  vite: ^8.3.7
  vitest: 4.1.10
  wrangler: 4.160.0

# Supply-chain rules, applied to every install, local and in CI alike.
# Refuses a transitive dependency that resolves to a git repository or a tarball URL instead of the registry.
blockExoticSubdeps: true
# Refuses a version published with weaker trust evidence (provenance, trusted publishing) than an earlier
# version of the same package, a common sign of a compromised publish.
trustPolicy: no-downgrade
# Seven days, in minutes: a version published longer ago than this is no longer held to the trust policy, so
# a long-standing release that predates provenance is not refused as a downgrade.
trustPolicyIgnoreAfter: 10080
# The only dependencies whose install scripts may run. A dependency that needs one gets an entry in the same
# change, with the reason in a comment.
allowBuilds:
  # Vite's bundler; its install script checks that the platform binary it ships resolved.
  esbuild: true
  # The Workers runtime Wrangler runs locally; its install script links the platform binary.
  workerd: true

# Makes pnpm refuse an install outside `engines` in package.json instead of only printing a warning, so a
# mismatch surfaces before it turns into a failure no one can reproduce. It lives here because pnpm ignores
# `engine-strict` in .npmrc: checked with pnpm 11.7.
engineStrict: true
