name: CI

on:
  pull_request:
  # A merge queue's check of the merge result before it lands. It never fires in a
  # repository without a queue.
  merge_group:
  # The full check after a merge. A project that requires a merge queue removes this
  # trigger: the queue lands the exact commit it checked, so a push run would only
  # repeat a passed check.
  push:
    branches: [main]
  workflow_dispatch:

# A pull request that is pushed to again abandons the run it just superseded; a
# merge-queue run, a push to `main` or a manual run keeps every run, because each is
# the authoritative check of a commit. Those runs are grouped by commit, not by
# branch: a group holds one pending run, and GitHub cancels it when another joins,
# whatever `cancel-in-progress` says.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The shared interface, the web host, and their tooling are platform-independent,
  # so they run on the fastest and cheapest runner. `docs/ci.md` explains the split.
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/setup

      - name: Check versions
        run: pnpm versions:check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build the web app
        run: pnpm build:web

      - name: Build the native frontend
        run: pnpm build:native

      - name: Install the browser for end-to-end tests
        run: pnpm --filter=@vista/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      # A check that writes a file has changed what it was checking, so the run
      # fails. `--untracked-files=all` lists a new file, not only the directory
      # that holds it.
      - name: Working tree is clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::A check left the working tree changed."
            exit 1
          fi
        shell: bash

      - name: Upload browser test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-results
          path: apps/web/test-results
          if-no-files-found: ignore

  # Rust is verified on Windows, the platform the native layer is built and used
  # on. `docs/ci.md` explains the split.
  rust:
    name: Rust
    runs-on: windows-latest
    timeout-minutes: 45
    # Line tables only: backtraces keep their file and line, and the variable and
    # type information only a debugger reads is dropped. Local builds keep Cargo's
    # defaults. A panic always prints its backtrace.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      RUST_BACKTRACE: 1
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/setup

      # Installs the version and components `rust-toolchain.toml` names, rather
      # than relying on rustup to do it on first use.
      - name: Install Rust
        run: rustup toolchain install
        shell: bash

      # Keyed on the toolchain and `Cargo.lock`, so a dependency or toolchain
      # change starts a fresh cache instead of reusing stale artifacts.
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/native/src-tauri

      - name: Check Rust formatting
        run: pnpm --filter=@vista/native format:rust:check

      - name: Lint Rust
        run: pnpm --filter=@vista/native lint:rust:check

      # A check that writes a file has changed what it was checking, so the run
      # fails. `--untracked-files=all` lists a new file, not only the directory
      # that holds it.
      - name: Working tree is clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::A check left the working tree changed."
            exit 1
          fi
        shell: bash

  # The installers a release ships, built on every change, so a change that breaks
  # bundling fails here rather than on release day. Windows is the primary desktop
  # platform and Linux the second; `docs/ci.md` explains the runners.
  desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
          # The oldest supported Ubuntu, so the AppImage links against a glibc that
          # most current distributions still run.
          - platform: Linux
            runner: ubuntu-22.04
    env:
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      RUST_BACKTRACE: 1
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # WebKitGTK and the libraries the Linux bundles link against.
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev patchelf file

      - name: Set up the workspace
        uses: ./.github/actions/setup

      - name: Install Rust
        run: rustup toolchain install
        shell: bash

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/native/src-tauri

      # The `Rust` job lints on Windows; this catches code that only compiles there.
      - name: Lint Rust on Linux
        if: runner.os == 'Linux'
        run: pnpm --filter=@vista/native lint:rust:check

      - name: Build the installers
        run: pnpm --filter=@vista/native build:desktop

      - name: Working tree is clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::A check left the working tree changed."
            exit 1
          fi
        shell: bash

      # Kept briefly, so a change's installers can be tried before it merges.
      - name: Upload the installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.platform }}
          path: |
            apps/native/src-tauri/target/release/bundle/nsis/*.exe
            apps/native/src-tauri/target/release/bundle/deb/*.deb
            apps/native/src-tauri/target/release/bundle/rpm/*.rpm
            apps/native/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
