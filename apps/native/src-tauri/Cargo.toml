[package]
name = "vista-native"
version = "0.0.1"
description = "Native host for Vista"
authors = ["Gustavo Motta"]
edition = "2024"

[lib]
name = "vista_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = "2"
# Used by the code tauri::generate_context! generates for the plugins section of tauri.conf.json.
serde_json = "1"

# The updater and restart exist only on desktop; mobile apps update through their store.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
