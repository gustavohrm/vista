name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A pull request that is pushed to again abandons the run it just superseded;
# `main` keeps every run, because each merge is the authoritative check of a commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The shared interface, the web host, and their tooling are platform-independent,
  # so they run on the fastest and cheapest runner. `docs/ci.md` explains the split.
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/setup

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build the web app
        run: pnpm build:web

      - name: Build the native frontend
        run: pnpm build:native

      - name: Install the browser for end-to-end tests
        run: pnpm --filter=@vista/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload browser test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-results
          path: apps/web/test-results
          if-no-files-found: ignore

  # Rust is verified on Windows, the platform the native layer is built and used
  # on. `docs/ci.md` explains the split.
  rust:
    name: Rust
    runs-on: windows-latest
    timeout-minutes: 45
    # Line tables only: backtraces keep their file and line, and the variable and
    # type information only a debugger reads is dropped. Local builds keep Cargo's
    # defaults. A panic always prints its backtrace.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      RUST_BACKTRACE: 1
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the workspace
        uses: ./.github/actions/setup

      # Installs the version and components `rust-toolchain.toml` names, rather
      # than relying on rustup to do it on first use.
      - name: Install Rust
        run: rustup toolchain install
        shell: bash

      # Keyed on the toolchain and `Cargo.lock`, so a dependency or toolchain
      # change starts a fresh cache instead of reusing stale artifacts.
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/native/src-tauri

      - name: Check Rust formatting
        run: pnpm --filter=@vista/native format:rust:check

      - name: Lint Rust
        run: pnpm --filter=@vista/native lint:rust:check

      - name: Test Rust
        run: pnpm --filter=@vista/native test:rust
